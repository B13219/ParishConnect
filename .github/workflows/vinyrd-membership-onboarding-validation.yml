name: Vinyrd Membership Onboarding Validation

on:
  push:
    branches:
      - fix/vinyrd-pilot-membership-onboarding-20261111
  pull_request:
    branches:
      - release/vinyrd-management-pilot-2026-11-13

permissions:
  contents: read

jobs:
  membership-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frontend JavaScript syntax
        run: node --check frontend/network-admin.js
      - name: Install backend test and browser dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,browser]"
      - name: Install Chromium dependencies
        working-directory: backend
        run: python -m playwright install --with-deps chromium
      - name: Run membership browser journey
        working-directory: backend
        env:
          VINYRD_TEST_BROWSER: "1"
        run: python -m pytest tests/test_church_network_browser.py -q
