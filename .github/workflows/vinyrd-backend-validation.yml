name: Vinyrd Backend Validation

on:
  pull_request:
    branches:
      - ci/vinyrd-validation-base
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parishconnect
          POSTGRES_PASSWORD: parishconnect
          POSTGRES_DB: parishconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parishconnect -d parishconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PARISHCONNECT_DATABASE_URL: postgresql+psycopg://parishconnect:parishconnect@localhost:5432/parishconnect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run Pytest
        run: pytest -q

      - name: Run Ruff
        run: ruff check app tests
