name: Vinyrd Backend Validation

on:
  pull_request:
    branches:
      - ci/vinyrd-validation-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PARISHCONNECT_DATABASE_URL: sqlite:///./vinyrd-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run Pytest
        run: pytest -q

      - name: Run Ruff
        run: ruff check app tests
