name: Vinyrd Backend Validation

on:
  push:
    branches:
      - feature/vinyrd-member-mobile
  pull_request:
    branches:
      - ci/vinyrd-validation-base
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parishconnect
          POSTGRES_PASSWORD: parishconnect
          POSTGRES_DB: parishconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parishconnect -d parishconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PARISHCONNECT_ENVIRONMENT: production
      PARISHCONNECT_DATABASE_URL: postgresql+psycopg://parishconnect:parishconnect@localhost:5432/parishconnect
      PARISHCONNECT_CORS_ORIGINS: ""
      PARISHCONNECT_PUBLIC_BASE_URL: https://pilot.vinyrd.example
      PARISHCONNECT_AUTH_TOKEN_SECRET: ci-vinyrd-auth-secret-2026-long-value-00001
      PARISHCONNECT_QR_TOKEN_SECRET: ci-vinyrd-qr-secret-2026-long-value-0000002
      PARISHCONNECT_PASSWORD_SALT: ci-vinyrd-password-salt-2026-long-value-003
      PARISHCONNECT_ACCESS_TOKEN_MINUTES: 120
      PARISHCONNECT_DEMO_PASSWORD: disabled-in-production
      PARISHCONNECT_BOOTSTRAP_ADMIN_NAME: Vinyrd Pilot Administrator
      PARISHCONNECT_BOOTSTRAP_ADMIN_EMAIL: pilot-admin@vinyrd.test
      PARISHCONNECT_BOOTSTRAP_ADMIN_PASSWORD: Vinyrd-CI-Admin-2026-Strong-Password!
      PARISHCONNECT_BOOTSTRAP_BRANCH_NAME: Vinyrd Pilot Church
      PARISHCONNECT_BOOTSTRAP_BRANCH_LOCATION: Dar es Salaam
      VINYRD_PILOT_BASE_URL: http://127.0.0.1:8003
      VINYRD_PILOT_PASTOR_PASSWORD: Vinyrd-CI-Pastor-2026-Strong-Password!

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Install browser journey dependencies
        run: python -m pip install -e ".[browser]" && python -m playwright install --with-deps chromium

      - name: Run Pytest
        env:
          VINYRD_TEST_BROWSER: "1"
          VINYRD_TEST_POSTGRES_URL: ${{ env.PARISHCONNECT_DATABASE_URL }}
        run: pytest -q

      - name: Check changed Python files and report known lint baseline
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import collections, json, os, subprocess
          from pathlib import Path
          base = os.environ.get("BASE_SHA") or "HEAD^"
          if set(base) == {"0"}:
              base = "HEAD^"
          paths = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=ACMR", base, "HEAD", "--", "*.py"], text=True).splitlines()
          paths = [p.removeprefix("backend/") for p in paths if p.startswith("backend/")]
          if paths:
              subprocess.run(["ruff", "check", *paths], check=True)
          result = subprocess.run(["ruff", "check", "app", "tests", "--output-format", "json"], capture_output=True, text=True)
          if result.returncode not in (0, 1):
              raise RuntimeError(result.stderr)
          allowed = {("app/api/routes/messages.py", "BLE001", 428), ("app/services/sms.py", "I001", 1)}
          findings = json.loads(result.stdout)
          seen = collections.Counter()
          for item in findings:
              key = (Path(item["filename"]).relative_to(Path.cwd()).as_posix(), item["code"], item["location"]["row"])
              seen[key] += 1
              print("Existing baseline" if key in allowed else "NEW FAILURE", key, item["message"])
          assert all(key in allowed and count == 1 for key, count in seen.items()), "New lint regression"
          PY

      - name: Check all frontend JavaScript syntax
        run: find ../frontend -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate production Linux container at exact commit
        run: bash ../scripts/validate-linux-container.sh

      - name: Upload container validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-container-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vinyrd-container-validation/*.log
            ${{ runner.temp }}/vinyrd-container-validation/*.json
            ${{ runner.temp }}/vinyrd-container-validation/result.txt
          if-no-files-found: warn
          retention-days: 7
